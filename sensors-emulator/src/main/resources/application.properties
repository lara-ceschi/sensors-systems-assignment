spring.application.name=sensors-emulator

# intervallo di schedulazione in millisecondi
sensor.simulator.scheduling.interval=10000

# ogni quante letture corrette avviene una lettua non valida
sensors.emulator.invalid.read.frequency=5

# connessione a rabbit
# TODO: mettere i container sotto una stessa rete e usare il nome del container al posto dell'host
spring.amqp.rabbitmq.host=172.17.0.2
spring.amqp.rabbitmq.port=5672
spring.amqp.rabbitmq.username=guest
spring.amqp.rabbitmq.password=guest